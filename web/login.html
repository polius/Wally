<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>Sign in · Wally</title>
  <link rel="icon" href="/assets/wally.png">
  <link rel="stylesheet" href="css/wally.css?v=210">
  <script>
    try {
      const pref = localStorage.getItem('theme') || 'system';
      const dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.themePreference = pref;
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <main class="login-page">
    <button type="button" class="icon-btn login-theme" id="loginTheme" aria-label="Switch appearance"></button>
    <div class="login-card">
      <div class="login-face">
        <div class="login-mark"><img src="/assets/wally.png" alt="Wally"></div>
        <div class="login-head">
          <div class="ltitle" id="loginTitle">Welcome back</div>
          <p class="lsub" id="loginSub">Enter the password for this ledger. It never leaves your host.</p>
        </div>
        <form class="login-form" id="loginForm" novalidate>
          <div class="login-field" id="passwordField">
            <label class="sr-only" for="passwordInput">Password</label>
            <input id="passwordInput" name="password" type="password" autocomplete="current-password" placeholder="Password" data-i18n-placeholder="settings.login.password_placeholder" aria-describedby="loginError" required autofocus>
            <button type="button" class="eye" id="passwordReveal" aria-label="Show password" aria-pressed="false"></button>
          </div>
          <p class="lerr" id="loginError" role="alert" hidden><span class="bang" aria-hidden="true">!</span><span id="loginErrorText"></span></p>
          <button type="submit" class="btn primary login-btn" id="loginButton">
            <span id="loginButtonLabel">Continue</span>
          </button>
        </form>
        <div class="llinks">
          <span>Lost the password?</span>
          <button type="button" class="lnk" id="forgotButton">Use the recovery file</button>
        </div>
      </div>
      <div class="login-foot" id="loginFoot">Wally · a quiet ledger on your own host</div>
    </div>
  </main>

  <script src="js/i18n.js?v=210"></script>
  <script src="js/common.js?v=210"></script>
  <script src="js/login.js?v=210"></script>
</body>
</html>
