<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>Transactions · Wally</title>
  <link rel="icon" href="/assets/wally.png">
  <link rel="stylesheet" href="css/wally.css?v=221">
  <script>
    try {
      const pref = localStorage.getItem('theme') || 'system';
      const dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.themePreference = pref;
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="appbar">
    <div class="appbar-in">
      <a class="brand" href="/" aria-label="Wally overview">
        <img src="/assets/wally.png" alt="">
        <span>Wally</span>
      </a>
      <nav class="tabs" aria-label="Main">
        <a class="tab" href="/" data-nav="overview" data-i18n="nav.overview">Overview</a>
        <a class="tab on" href="/transactions.html" data-nav="transactions" aria-current="page">Transactions</a>
        <a class="tab" href="/settings.html" data-nav="settings">Settings</a>
      </nav>
      <div class="appbar-right">
        <a class="avatar-btn" id="navAvatar" href="/settings.html" aria-label="Settings">PA</a>
      </div>
    </div>
  </header>

  <main class="page" id="main">
    <div class="page-head">
      <div>
        <div class="eyebrow" data-i18n="nav.transactions">Transactions</div>
        <h1>
          <button type="button" class="tx-month" id="rangeButton" aria-haspopup="dialog" aria-expanded="false">
            <span id="rangeLabel">October 2026</span>
            <span class="chev" aria-hidden="true">⌄</span>
          </button>
        </h1>
        <div class="tx-summary" id="txSummary"><span>Loading…</span></div>
      </div>
      <div class="head-actions">
        <button type="button" class="btn primary" data-compose>
          <svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
          <span data-i18n="dashboard.add_transaction">Add transaction</span>
        </button>
      </div>
    </div>

    <div class="tx-toolbar">
      <label class="tx-search" for="searchInput">
        <svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2 14 14"/></svg>
        <input id="searchInput" type="search" placeholder="Search names, categories, tags, people…" data-i18n-placeholder="transactions.search_people" autocomplete="off" aria-label="Search transactions">
        <kbd class="tx-kbd" aria-hidden="true">⌘K</kbd>
      </label>
      <button type="button" class="tx-filter" id="filterButton" aria-haspopup="dialog" aria-expanded="false">
        <svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4h11M4.5 8h7M6.5 12h3"/></svg>
        Filter <b id="filterCount" hidden>0</b>
      </button>
      <button type="button" class="tx-select-link" id="selectToggle"><span>Select</span></button>
    </div>

    <div class="tx-bulk" id="bulkBar" hidden>
      <span class="tx-bulk-count" id="bulkCount">0 selected</span>
      <button type="button" class="tx-bulk-a" id="bulkExport">Export</button>
      <button type="button" class="tx-bulk-a danger" id="bulkDelete">Delete</button>
      <button type="button" class="tx-bulk-a clear" id="bulkClear">Done</button>
    </div>

    <div class="tx-scroll" id="txScroll" aria-live="polite"></div>
    <div class="tx-foot" id="txFoot" hidden>
      <span class="tx-all" id="txAllLabel"></span>
      <span>·</span>
      <span>Rows follow the day they happened, then the moment they were entered.</span>
    </div>
  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="/" data-nav="overview"><svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" aria-hidden="true"><path d="M3.2 12.8V8.4M8 12.8V3.4M12.8 12.8v-6"/></svg>Overview</a>
    <a href="/transactions.html" class="on" data-nav="transactions"><svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" aria-hidden="true"><path d="M3 4.5h10M3 8h10M3 11.5h6"/></svg>Transactions</a>
    <button type="button" class="fab" data-compose aria-label="Add transaction"><svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
    <a href="/settings.html" data-nav="settings"><svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4.5h4M9.5 4.5h4M2.5 8h6M11.5 8h2M2.5 11.5h4M9.5 11.5h4"/><circle cx="8" cy="4.5" r="1.2"/><circle cx="10" cy="8" r="1.2"/><circle cx="8" cy="11.5" r="1.2"/></svg>Settings</a>
  </nav>

  <dialog class="inspector" id="inspector" aria-label="Transaction details">
    <div class="inspector-panel">
      <div class="lgi-h">
        <span class="eyebrow">Transaction</span>
        <button type="button" class="icon-btn" id="inspectorClose" aria-label="Close details">
          <svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6"/></svg>
        </button>
      </div>
      <div class="lgi-body" id="inspectorBody"></div>
      <div class="lgi-actions" id="inspectorActions">
        <button type="button" class="btn ghost" id="inspectorEdit">
          <svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 13h2.6l7-7a1.8 1.8 0 0 0-2.6-2.6l-7 7V13Z"/></svg>
          Edit
        </button>
        <button type="button" class="btn ghost" id="inspectorDuplicate">
          <svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="5" y="5" width="8" height="8" rx="1.4"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2H3.5A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>
          Duplicate
        </button>
        <button type="button" class="btn danger" id="inspectorDelete" aria-label="Delete transaction">
          <svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 4.5h10M6 4.5V3h4v1.5M4.5 4.5l.6 9h5.8l.6-9"/></svg>
        </button>
      </div>
    </div>
  </dialog>

  <script src="js/i18n.js?v=221"></script>
  <script src="js/common.js?v=221"></script>
  <script src="js/transactions.js?v=221"></script>
</body>
</html>
